%YAML 1.2
---
$schema: http://json-schema.org/draft-07/schema#

title: Vendor Prefixes
maintainers:
  - Rob Herring <robh@kernel.org>
  - Grant Likely <grant.likely@linaro.org>
description: |
  This is a list of vendor prefixes used in device tree compatible
  strings and properties.  Each vendor prefix must be a unique string
  that identifies the vendor.  The prefix is used to construct the
  compatible string by appending the device name to the prefix.

  For example, a device from Acme Corporation might have a compatible
  string like "acme,widget".  The vendor prefix would be "acme".

  The vendor prefix should be lowercase and use hyphens instead of
  spaces.  It should not contain any other special characters.

  New vendor prefixes should be added in alphabetical order.

type: object
